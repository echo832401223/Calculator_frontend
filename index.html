<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>计算器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f0f0f0;
            padding-top: 30px;
        }
        .calculator {
            width: 360px;
            background: #fff;
            padding:20px;
            border-radius:12px;
            box-shadow: 0 2px 10px #00000022;
        }
        #inputBox {
            width:100%;
            height:60px;
            font-size:28px;
            text-align:right;
            padding: 8px 12px;
            margin-bottom:16px;
        }
        .btn-grid{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:10px;
        }
        button{
            height:60px;
            font-size:22px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        .op{background:#ddd;}
        .clear{background:#ff5555;color:white;}
        .equal{background:#4285f4;color:white;grid-column:1/-1;}
        #historyBox{
            width:360px;
            margin-top:20px;
            background:#fff;
            padding:15px;
            border-radius:12px;
        }
        .history-item{
            padding:4px 0;
            border-bottom:1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="inputBox" readonly>
        <div class="btn-grid">
            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button onclick="appendOp('/')" class="op">/</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button onclick="appendOp('*')" class="op">*</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button onclick="appendOp('-')" class="op">-</button>

            <button onclick="appendNum('0')">0</button>
            <button onclick="appendNum('.')">.</button>
            <button onclick="clearAll()" class="clear">C</button>
            <button onclick="appendOp('+')" class="op">+</button>

            <button onclick="calcEqual()" class="equal">=</button>
        </div>
    </div>
    <div id="historyBox">
        <h3>计算历史</h3>
        <div id="historyList"></div>
    </div>

<script>
    let expression = "";
    // 标记：是否刚刚完成一次计算
    let isCalculated = false;
    const inputBox = document.getElementById("inputBox");
    const historyListDom = document.getElementById("historyList");

    // 数字按键
    function appendNum(num) {
        // 如果刚刚计算完成：按数字 → 开启新算式，清空旧结果
        if(isCalculated){
            expression = num;
            isCalculated = false;
        }else{
            expression += num;
        }
        inputBox.value = expression;
    }

    // 运算符按键 + - * /
    function appendOp(op) {
        // 如果刚刚计算完成：把上一次的结果作为开头，继续运算
        if(isCalculated){
            isCalculated = false;
        }
        expression += op;
        inputBox.value = expression;
    }

    // C 清零
    function clearAll() {
        expression = "";
        isCalculated = false;
        inputBox.value = "";
    }

    // 等于号
    async function calcEqual() {
        // 没有算式 或者 已经是计算完成状态 → 直接返回，不请求后端，不新增历史
        if(!expression || isCalculated){
            return;
        }
        try {
            const resp = await fetch("http://localhost:8080/api/calc", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({expr: expression})
            });
            if (!resp.ok){
                inputBox.value = "请求错误";
                return;
            }
            const data = await resp.json();
            const resVal = data.result ?? "表达式错误";
            inputBox.value = resVal;
            expression = resVal;
            isCalculated = true; // 
            await loadHistory();
        } catch (err) {
            console.error(err);
            inputBox.value = "网络错误";
        }
    }

    // 加载历史
    async function loadHistory(){
        try{
            const res = await fetch("http://localhost:8080/api/history");
            if(!res.ok) return;
            const list = await res.json();
            historyListDom.innerHTML = "";
            list.forEach(item=>{
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerText = `${item.expression} = ${item.result}`;
                historyListDom.appendChild(div);
            })
        }catch(err){
            historyListDom.innerHTML = "<div>暂无历史记录</div>"
        }
    }
    loadHistory();
</script>
</body>
</html>
